name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client-customer/package-lock.json
            client-admin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client-customer
      - run: npm ci --prefix client-admin
      - run: npm run lint
      - run: npm run build
